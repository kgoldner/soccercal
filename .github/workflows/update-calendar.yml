name: Refresh soccer calendar

on:
  schedule:
    # 07:15 UTC daily — early morning Eastern, after European fixture
    # announcements land. Cron here is always UTC.
    - cron: "15 7 * * *"
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: soccer-calendar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh fixtures
        run: python soccer_cal.py --calendar soccer-calendar.ics --verbose

      - name: Commit if the calendar changed
        run: |
          if [[ -n "$(git status --porcelain soccer-calendar.ics)" ]]; then
            git config user.name  "soccer-cal bot"
            git config user.email "actions@github.com"
            git add soccer-calendar.ics
            git commit -m "Refresh fixtures $(date -u +%Y-%m-%d)"
            git push
            echo "Calendar updated."
          else
            echo "No fixture changes today."
          fi
